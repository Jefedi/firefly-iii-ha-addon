name: Build and Push to GHCR

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./firefly_iii
          platforms: linux/${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          push: true
          tags: |
            ghcr.io/jefedi/${{ matrix.arch }}-firefly-iii-ha-addon:latest
            ghcr.io/jefedi/${{ matrix.arch }}-firefly-iii-ha-addon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=1.0.0
            BUILD_ARCH=${{ matrix.arch }}